<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Spring MVC</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<div class="container">
    <div class="card auth-card">
        <div class="card-header">
            <h1>Welcome Back</h1>
            <p>Sign in to continue</p>
        </div>


        <div class="alert alert-error">Your session has expired. Please log in again.</div>

        <form action="/login" method="post" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" name="username" value="">

            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" name="password" value="">

            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="/register">Create one</a>
        </p>
    </div>
</div>
</body>
</html>
