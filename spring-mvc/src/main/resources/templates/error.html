<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Error - Spring MVC')}"></head>
<body class="auth-page">
<div class="container">
    <div class="card auth-card error-card">
        <div class="error-code" th:text="${statusCode} ?: 'Error'">500</div>
        <h1 th:text="${errorTitle} ?: 'Error'">Something Went Wrong</h1>
        <p class="error-message" th:text="${errorMessage} ?: 'An unexpected error occurred.'"></p>
        <div class="error-actions">
            <a th:href="@{/home}" class="btn btn-primary">Go to Home</a>
            <a th:href="@{/login}" class="btn btn-outline">Back to Login</a>
        </div>
    </div>
</div>
</body>
</html>
