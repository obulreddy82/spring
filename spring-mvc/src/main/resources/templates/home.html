<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Home - Spring MVC')}"></head>
<body class="home-page">
<nav class="navbar">
    <div class="nav-brand">Spring MVC Demo</div>
    <div class="nav-actions">
        <span class="nav-user" th:text="'Hello, ' + ${user.fullName}"></span>
        <a th:href="@{/logout}" class="btn btn-outline">Logout</a>
    </div>
</nav>

<div class="container">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card home-card">
        <h1>Dashboard</h1>
        <p class="subtitle">You are successfully logged in.</p>

        <div class="user-details">
            <div class="detail-row">
                <span class="detail-label">Full Name</span>
                <span class="detail-value" th:text="${user.fullName}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Username</span>
                <span class="detail-value" th:text="${user.username}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Email</span>
                <span class="detail-value" th:text="${user.email}"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Registered At</span>
                <span class="detail-value" th:text="${#temporals.format(user.registeredAt, 'dd MMM yyyy, HH:mm')}"></span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
