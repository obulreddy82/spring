<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Login - Spring MVC')}"></head>
<body class="auth-page">
<div class="container">
    <div class="card auth-card">
        <div class="card-header">
            <h1>Welcome Back</h1>
            <p>Sign in to continue</p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/login}" th:object="${loginDto}" method="post" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" placeholder="Enter your username"
                       th:classappend="${#fields.hasErrors('username')} ? 'input-error'">
                <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Enter your password"
                       th:classappend="${#fields.hasErrors('password')} ? 'input-error'">
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a th:href="@{/register}">Create one</a>
        </p>
    </div>
</div>
</body>
</html>
